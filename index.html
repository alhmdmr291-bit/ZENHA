<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b4bdb">
<title>ZENHA — لوحة الإدارة</title>

<style>
:root{
  --p:#5b4bdb;
  --p2:#806ff0;
  --bg:#f6f6fa;
  --card:#fff;
  --text:#17171a;
  --muted:#777;
  --border:#ececf2;
  --danger:#e74c3c;
  --success:#20a464;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:var(--text)
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:22px
}

.head{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  border-radius:24px;
  padding:24px;
  margin-bottom:18px
}

.head h1{
  margin:0 0 8px
}

.head p{
  margin:0;
  opacity:.9
}

.status{
  margin-top:15px;
  background:#ffffff22;
  border-radius:12px;
  padding:11px 14px;
  font-size:14px;
  font-weight:bold;
  transition:.3s
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 5px 22px #19144612;
  margin-bottom:15px
}

.field{
  margin-bottom:12px
}

.field label{
  display:block;
  font-size:12px;
  color:#666;
  margin-bottom:6px
}

.field input,
.field select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14px;
  background:#fff
}

button{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.primary{
  background:var(--p);
  color:#fff
}

.muted{
  background:#eee;
  color:#333
}

.danger{
  background:#fee;
  color:var(--danger)
}

.actions{
  display:flex;
  gap:8px
}

.actions button{
  flex:1
}

.product{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  margin:8px 0
}

.thumb{
  width:65px;
  height:65px;
  border-radius:12px;
  background:#f1f0f8;
  display:grid;
  place-items:center;
  font-size:28px;
  overflow:hidden;
  flex-shrink:0
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:contain
}

.info{
  flex:1
}

.info h3{
  font-size:14px;
  margin:0 0 5px
}

.info small{
  color:var(--muted)
}

.badge{
  display:inline-block;
  background:#eee;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  margin-top:8px
}

.message{
  display:none;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  font-weight:bold;
  font-size:14px
}

.message.success{
  display:block;
  background:#e9f9f0;
  color:#16834f
}

.message.error{
  display:block;
  background:#fff0ef;
  color:#c0392b
}

.loading{
  text-align:center;
  padding:20px;
  color:#777
}

.empty{
  text-align:center;
  padding:25px;
  color:#777
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr
  }

  .wrap{
    padding:14px
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">

    <h1>⚙️ لوحة إدارة ZENHA</h1>

    <p>هذه اللوحة منفصلة عن تطبيق الزبون.</p>

    <div id="connectionStatus" class="status">
      🔄 جاري تشغيل قاعدة البيانات...
    </div>

  </div>

  <div id="message" class="message"></div>

  <div class="grid">

    <!-- إضافة المنتج -->

    <div class="card">

      <h2 id="formTitle">➕ إضافة منتج</h2>

      <div class="field">
        <label>اسم المنتج</label>
        <input id="name" placeholder="اسم المنتج">
      </div>

      <div class="field">
        <label>السعر</label>
        <input id="price" type="number" placeholder="السعر">
      </div>

      <div class="field">
        <label>السعر القديم</label>
        <input id="old" type="number" placeholder="السعر القديم">
      </div>

      <div class="field">
        <label>القسم</label>
        <select id="cat"></select>
      </div>

      <div class="field">
        <label>التقييم</label>
        <input
          id="rating"
          type="number"
          min="0"
          max="5"
          step=".1"
          value="5"
        >
      </div>

      <div class="field">
        <label>صورة المنتج</label>
        <input
          id="image"
          type="file"
          accept="image/*"
        >
      </div>

      <div id="preview"
        style="
          display:none;
          height:160px;
          background:#f1f0f8;
          border-radius:15px;
          margin-bottom:12px;
          overflow:hidden
        ">
      </div>

      <div class="actions">

        <button
          id="saveBtn"
          class="primary"
          onclick="saveProduct()">
          💾 حفظ
        </button>

        <button
          class="muted"
          onclick="resetForm()">
          إلغاء
        </button>

      </div>

    </div>


    <!-- المنتجات -->

    <div class="card">

      <h2>📦 المنتجات</h2>

      <div id="count" class="badge">
        عدد المنتجات: 0
      </div>

      <div id="list">

        <div class="loading">
          🔄 جاري تحميل المنتجات...
        </div>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     Firebase
========================= -->

<script
src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
</script>


<script>

/* =====================================================
   عناصر الصفحة
===================================================== */

const connectionStatus =
  document.getElementById('connectionStatus');

const message =
  document.getElementById('message');

const nameInput =
  document.getElementById('name');

const priceInput =
  document.getElementById('price');

const oldInput =
  document.getElementById('old');

const ratingInput =
  document.getElementById('rating');

const imageInput =
  document.getElementById('image');

const preview =
  document.getElementById('preview');

const list =
  document.getElementById('list');

const count =
  document.getElementById('count');

const formTitle =
  document.getElementById('formTitle');

const saveBtn =
  document.getElementById('saveBtn');

const cat =
  document.getElementById('cat');


/* =====================================================
   حالة التطبيق
===================================================== */

let db = null;
let products = [];
let editing = null;
let imageData = '';

let firebaseReady = false;


/* =====================================================
   Firebase Config
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBJHuI52g0uEpNb5VCCCT9GvBKO6ZY2U2",

  authDomain:
    "zenha-6b9c7.firebaseapp.com",

  projectId:
    "zenha-6b9c7",

  storageBucket:
    "zenha-6b9c7.firebasestorage.app",

  messagingSenderId:
    "822749564920",

  appId:
    "1:822749564920:web:7cd17e460565f3f675d00d",

  measurementId:
    "G-JQHTDND43V"

};


/* =====================================================
   الأقسام
===================================================== */

const categories = [

  {
    id:'clothes',
    name:'ملابس'
  },

  {
    id:'electronics',
    name:'إلكترونيات'
  },

  {
    id:'beauty',
    name:'جمال وعناية'
  },

  {
    id:'home',
    name:'المنزل'
  },

  {
    id:'accessories',
    name:'إكسسوارات'
  }

];


cat.innerHTML =
  categories.map(function(c){

    return `
      <option value="${c.id}">
        ${c.name}
      </option>
    `;

  }).join('');


/* =====================================================
   الرسائل
===================================================== */

function showMessage(text, success){

  message.textContent = text;

  message.className =
    'message ' +
    (success ? 'success' : 'error');

}


/* =====================================================
   حالة الاتصال
===================================================== */

function showConnection(text, success){

  connectionStatus.textContent = text;

  connectionStatus.style.background =
    success
      ? '#20a464'
      : '#c0392b';

}


/* =====================================================
   التأكد من تحميل Firebase
===================================================== */

if(typeof firebase === 'undefined'){

  showConnection(
    '🔴 Firebase لم يتم تحميله',
    false
  );

  showMessage(
    '❌ لم يتم تحميل Firebase. تأكد من الإنترنت ثم أعد تحميل الصفحة.',
    false
  );

}else{

  try{

    firebase.initializeApp(firebaseConfig);

    db = firebase.firestore();

    firebaseReady = true;

    console.log(
      '✅ Firebase initialized successfully'
    );

    testFirebase();

  }catch(error){

    console.error(
      'Firebase initialization error:',
      error
    );

    showConnection(
      '🔴 فشل تشغيل Firebase',
      false
    );

    showMessage(
      '❌ فشل تشغيل Firebase: ' +
      error.message,
      false
    );

  }

}


/* =====================================================
   اختبار Firebase
===================================================== */

function testFirebase(){

  if(!db){

    showConnection(
      '🔴 قاعدة البيانات غير جاهزة',
      false
    );

    return;
  }


  showConnection(
    '🔄 جاري اختبار الاتصال...',
    true
  );


  let finished = false;


  /*
    مهلة 8 ثواني
  */

  const timeout = setTimeout(function(){

    if(finished) return;

    finished = true;

    showConnection(
      '🔴 الاتصال بطيء أو محظور',
      false
    );

    showMessage(
      '❌ لم تستجب قاعدة البيانات خلال 8 ثواني. تأكد من الإنترنت وقواعد Firestore.',
      false
    );

  },8000);


  db.collection('products')
    .limit(1)
    .get()

    .then(function(snapshot){

      if(finished) return;

      finished = true;

      clearTimeout(timeout);


      console.log(
        '✅ Firestore connected',
        snapshot.size
      );


      showConnection(
        '🟢 تم الاتصال بقاعدة البيانات',
        true
      );


      showMessage(
        '✅ الاتصال بقاعدة البيانات ناجح.',
        true
      );


      startProductsListener();

    })

    .catch(function(error){

      if(finished) return;

      finished = true;

      clearTimeout(timeout);


      console.error(
        '❌ Firestore error:',
        error
      );


      showConnection(
        '🔴 فشل الاتصال بقاعدة البيانات',
        false
      );


      let reason =
        error.message || 'خطأ غير معروف';


      if(error.code === 'permission-denied'){

        reason =
          'صلاحيات Firestore تمنع الوصول. افتح Firestore Rules واسمح بالقراءة والكتابة مؤقتًا للاختبار.';

      }


      showMessage(
        '❌ ' + reason,
        false
      );

    });

}


/* =====================================================
   الاستماع للمنتجات
===================================================== */

function startProductsListener(){

  if(!db) return;


  db.collection('products')

    .onSnapshot(

      function(snapshot){

        products = [];


        snapshot.forEach(function(doc){

          products.push({

            id: String(doc.id),

            ...doc.data()

          });

        });


        products.sort(function(a,b){

          const aTime =
            a.createdAt &&
            a.createdAt.seconds
              ? a.createdAt.seconds
              : 0;

          const bTime =
            b.createdAt &&
            b.createdAt.seconds
              ? b.createdAt.seconds
              : 0;


          return bTime - aTime;

        });


        render();

      },


      function(error){

        console.error(
          'Snapshot error:',
          error
        );


        showConnection(
          '🔴 فشل قراءة المنتجات',
          false
        );


        showMessage(
          '❌ خطأ في قراءة المنتجات: ' +
          error.message,
          false
        );

      }

    );

}


/* =====================================================
   الصور
===================================================== */

imageInput.addEventListener(
  'change',
  function(e){

    const file =
      e.target.files[0];


    if(!file) return;


    if(file.size > 5 * 1024 * 1024){

      showMessage(
        '❌ حجم الصورة أكبر من 5MB.',
        false
      );

      imageInput.value = '';

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(){

        imageData =
          reader.result;


        preview.style.display =
          'block';


        preview.innerHTML =
          '<img src="' +
          imageData +
          '" style="width:100%;height:100%;object-fit:contain">';

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   حفظ المنتج
===================================================== */

async function saveProduct(){

  try{

    if(!firebaseReady || !db){

      showMessage(
        '❌ قاعدة البيانات غير متصلة.',
        false
      );

      return;
    }


    const productName =
      nameInput.value.trim();


    const productPrice =
      Number(priceInput.value);


    const productOld =
      Number(oldInput.value) ||
      productPrice;


    const productCat =
      cat.value;


    const productRating =
      Number(ratingInput.value) || 5;


    if(!productName){

      showMessage(
        '⚠️ اكتب اسم المنتج.',
        false
      );

      return;
    }


    if(!productPrice || productPrice <= 0){

      showMessage(
        '⚠️ اكتب سعر المنتج.',
        false
      );

      return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
      '⏳ جاري الحفظ...';


    /* ==========================
       تعديل
    ========================== */

    if(editing !== null){

      const ref =
        db.collection('products')
          .doc(String(editing));


      const data = {

        name:
          productName,

        price:
          productPrice,

        old:
          productOld,

        cat:
          productCat,

        rating:
          productRating,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };


      if(imageData){

        data.image =
          imageData;

      }


      await ref.update(data);


      showMessage(
        '✅ تم تعديل المنتج في قاعدة البيانات.',
        true
      );

    }


    /* ==========================
       إضافة
    ========================== */

    else{

      const ref =
        db.collection('products')
          .doc();


      const data = {

        name:
          productName,

        price:
          productPrice,

        old:
          productOld,

        cat:
          productCat,

        rating:
          productRating,

        image:
          imageData || '',

        icon:
          '🛍️',

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };


      await ref.set(data);


      showMessage(
        '✅ تم حفظ المنتج في قاعدة البيانات.',
        true
      );

    }


    resetForm();


  }catch(error){

    console.error(
      'Save error:',
      error
    );


    showMessage(
      '❌ لم يتم الحفظ: ' +
      error.message,
      false
    );


  }finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      '💾 حفظ';

  }

}


/* =====================================================
   تعديل
===================================================== */

function edit(id){

  const p =
    products.find(function(x){

      return String(x.id) ===
        String(id);

    });


  if(!p) return;


  editing =
    String(id);


  formTitle.textContent =
    '✏️ تعديل منتج';


  nameInput.value =
    p.name || '';


  priceInput.value =
    p.price || '';


  oldInput.value =
    p.old || '';


  cat.value =
    p.cat || 'clothes';


  ratingInput.value =
    p.rating || 5;


  imageData =
    p.image || '';


  if(imageData){

    preview.style.display =
      'block';


    preview.innerHTML =
      '<img src="' +
      imageData +
      '" style="width:100%;height:100%;object-fit:contain">';

  }else{

    preview.style.display =
      'none';

    preview.innerHTML =
      '';

  }


  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


/* =====================================================
   حذف
===================================================== */

async function del(id){

  if(!db){

    showMessage(
      '❌ قاعدة البيانات غير متصلة.',
      false
    );

    return;
  }


  if(!confirm('هل تريد حذف المنتج؟')){

    return;

  }


  try{

    await db
      .collection('products')
      .doc(String(id))
      .delete();


    showMessage(
      '✅ تم حذف المنتج من قاعدة البيانات.',
      true
    );


  }catch(error){

    console.error(
      'Delete error:',
      error
    );


    showMessage(
      '❌ فشل حذف المنتج: ' +
      error.message,
      false
    );

  }

}


/* =====================================================
   إعادة النموذج
===================================================== */

function resetForm(){

  editing = null;

  imageData = '';


  formTitle.textContent =
    '➕ إضافة منتج';


  nameInput.value =
    '';


  priceInput.value =
    '';


  oldInput.value =
    '';


  cat.value =
    categories[0].id;


  ratingInput.value =
    '5';


  imageInput.value =
    '';


  preview.style.display =
    'none';


  preview.innerHTML =
    '';

}


/* =====================================================
   تنسيق السعر
===================================================== */

function money(n){

  return Number(n || 0)
    .toLocaleString('ar-SA') +
    ' ل.س';

}


/* =====================================================
   عرض المنتجات
===================================================== */

function render(){

  count.textContent =
    'عدد المنتجات: ' +
    products.length;


  if(!products.length){

    list.innerHTML =
      '<div class="empty">' +
      '📦 لا توجد منتجات في قاعدة البيانات' +
      '</div>';

    return;

  }


  list.innerHTML =
    products.map(function(p){

      const image =
        p.image
          ? '<img src="' +
            p.image +
            '" alt="">'
          : (p.icon || '🛍️');


      return `

        <div class="product">

          <div class="thumb">
            ${image}
          </div>

          <div class="info">

            <h3>
              ${escapeHtml(p.name || '')}
            </h3>

            <small>
              ${money(p.price)}
            </small>

          </div>

          <button
            class="muted"
            onclick="edit('${String(p.id)}')">
            ✏️
          </button>

          <button
            class="danger"
            onclick="del('${String(p.id)}')">
            🗑️
          </button>

        </div>

      `;

    }).join('');

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}

</script>

</body>
</html>
